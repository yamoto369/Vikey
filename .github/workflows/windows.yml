
name: windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to build and release (e.g. v1.0.14)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh

      - name: Engine lock (rule cases, golden, Telex lock, driver parity, perf)
        run: pwsh Windows/check.ps1
        shell: pwsh

      - name: Build app (version from project.yml)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "VIKEY_VERSION=$ver" >> $env:GITHUB_ENV
          cmake -S Windows -B Windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build Windows/build --config Release --target vikey
        shell: pwsh

      - uses: actions/upload-artifact@v4
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        with:
          name: Vikey-windows-${{ matrix.arch }}
          path: Windows/build/App/Vikey.exe

  package:
    needs: engine
    runs-on: windows-latest

    env:
      CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
      CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Code signing tool (ssign - Certum SimplySign cloud cert)
        if: env.CERTUM_OTP != ''
        run: |
          Invoke-WebRequest -Uri https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-windows-x86_64.zip -OutFile ssign.zip
          Expand-Archive ssign.zip -DestinationPath ssign
          $exe = (Get-ChildItem ssign -Recurse -Filter ssign.exe | Select-Object -First 1).FullName
          "SSIGN=$exe" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Installers (Inno Setup) + portable zips
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "$ver" | Out-Host

          New-Item -ItemType Directory -Force dist | Out-Null

          function Sign($file) {
            if (-not $env:SSIGN) {
              "unsigned: $file (no CERTUM_OTP secret)" | Out-Host
              return
            }

            & $env:SSIGN $file
            if ($LASTEXITCODE -ne 0) {
              throw "signing failed: $file"
            }
          }

          foreach ($arch in @('x64', 'arm64')) {
            $src = "artifacts/Vikey-windows-$arch"

            Sign "$src/Vikey.exe"

            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$ver" "/DArch=$arch" "/DSrc=$((Resolve-Path $src).Path)" Windows/installer/Vikey.iss

            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed for $arch"
            }

            Sign "Windows/installer/out/Vikey-$ver-$arch-Setup.exe"

            Move-Item "Windows/installer/out/Vikey-$ver-$arch-Setup.exe" dist/

            Compress-Archive -Path "$src/Vikey.exe" -DestinationPath "dist/Vikey-$ver-$arch-portable.zip"
          }

          Get-ChildItem dist | Out-Host
        shell: pwsh

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release not found. Creating release..."

            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TAG `
              --generate-notes

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release"
            }
          }
        shell: pwsh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:RELEASE_TAG dist/* `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets"
          }
        shell: pwsh
